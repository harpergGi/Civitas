<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Support | Civitas</title>
    <style>
        body { font-family: 'DM Sans', sans-serif; background: #f8f6f1; color: #2c3e5c; padding: 4rem; display: flex; justify-content: center; }
        .box { background: white; padding: 3rem; border-radius: 8px; border: 1px solid #e2e8f0; max-width: 500px; width: 100%; }
        h1 { font-family: 'Cormorant Garamond', serif; color: #0a1628; margin-bottom: 1.5rem; text-align: center; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 1.5rem; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn { background: #0a1628; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 1rem; }
        .btn:hover { background: #c9a84c; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Send a Request</h1>
        <form name="contact" method="POST" data-netlify="true">
            <input type="hidden" name="form-name" value="contact" />
            <label>Your Email</label>
            <input type="email" name="email" required>
            
            <label>Message</label>
            <textarea name="message" rows="5" required></textarea>
            
            <button type="submit" class="btn">Send Message</button>
        </form>
    </div>
</body>
</html>
