<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Catalog | Civitas</title>
  <!-- NETLIFY IDENTITY LOCK -->
  <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.location.href = "index.html";
        }
      });
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root { --navy: #0a1628; --navy-light: #12284c; --gold: #c9a84c; --white: #ffffff; --off-white: #f8f6f1; --text-muted: #8a9bb5; --text-body: #2c3e5c; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--off-white); color: var(--text-body); display: flex; min-height: 100vh; }
    
    /* SIDEBAR */
    .sidebar { width: 260px; background: var(--navy); color: var(--white); display: flex; flex-direction: column; padding: 2rem 1.5rem; border-right: 1px solid rgba(201,168,76,0.2); }
    .logo { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; font-weight: 600; color: var(--white); text-decoration: none; margin-bottom: 3rem; text-align: center; }
    .logo span { color: var(--gold); }
    .nav-link { color: var(--text-muted); text-decoration: none; padding: 12px 15px; margin-bottom: 8px; border-radius: 6px; font-weight: 500; transition: all 0.3s ease; display: flex; align-items: center; gap: 10px; }
    .nav-link:hover { background: rgba(255,255,255,0.05); color: var(--white); }
    .nav-link.active { background: rgba(201,168,76,0.1); color: var(--gold); border-left: 3px solid var(--gold); }

    /* MAIN CONTENT */
    .main-content { flex: 1; padding: 3rem 4rem; }
    h1 { font-family: 'Cormorant Garamond', serif; font-size: 2.8rem; color: var(--navy); margin-bottom: 2rem; }
    p { color: var(--text-muted); }
  </style>
</head>
<body>

  <aside class="sidebar">
    <a href="index.html" class="logo">Civitas<span>.</span></a>
    <nav>
      <a href="learning-dashboard.html" class="nav-link">Dashboard</a>
      <a href="course-catalog.html" class="nav-link active">Course Catalog</a>
      <a href="my-certificates.html" class="nav-link">My Certificates</a>
      <a href="resources.html" class="nav-link">Resources & Forms</a>
      <a href="settings.html" class="nav-link" style="margin-top: 2rem;">Settings</a>
      <a href="index.html" class="nav-link">Log Out</a>
    </nav>
  </aside>

  <main class="main-content">
    <h1>Course Catalog</h1>
    <p>Curriculum currently in development.</p>
  </main>

</body>
</html>
