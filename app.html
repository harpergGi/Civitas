<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Civi">
<meta name="theme-color" content="#0a1628">
<title>Civi by Civitas</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#0a1628;--navy-mid:#111f3a;--navy-light:#1a2f52;--gold:#c9a84c;--gold-light:#e8c97a;--gold-dim:rgba(201,168,76,0.12);--white:#fff;--muted:#8a9bb5;--green:#2ecc71;--red:#e74c3c;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--navy);}
body{font-family:'DM Sans',sans-serif;color:var(--white);display:flex;flex-direction:column;max-width:430px;margin:0 auto;}
.layer{position:fixed;inset:0;max-width:430px;margin:0 auto;display:none;flex-direction:column;background:var(--navy);z-index:10;}
.layer.visible{display:flex;}
#loading{align-items:center;justify-content:center;z-index:100;}
.ld-logo{font-family:'Cormorant Garamond',serif;font-size:2.5rem;font-weight:600;color:var(--white);letter-spacing:0.08em;margin-bottom:0.75rem;}
.ld-logo span{color:var(--gold);}
.ld-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:ldot 1.2s ease infinite;}
@keyframes ldot{0%,80%,100%{opacity:0.2;}40%{opacity:1;}}
#onboarding{overflow:hidden;position:relative;}
.ob-slides{display:flex;transition:transform 0.4s ease;width:100%;height:100%;will-change:transform;}
.ob-slide{min-width:100%;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2.5rem 2rem 7rem;text-align:center;flex-shrink:0;}
.ob-mark{margin-bottom:1.5rem;}
.ob-wordmark{font-family:'Cormorant Garamond',serif;font-size:3.5rem;font-weight:600;color:var(--white);letter-spacing:0.06em;margin-bottom:0.25rem;}
.ob-wordmark span{color:var(--gold);}
.ob-by{font-size:0.68rem;color:var(--muted);letter-spacing:0.2em;text-transform:uppercase;margin-bottom:1.75rem;}
.ob-tagline{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:300;color:var(--white);line-height:1.4;margin-bottom:0.85rem;}
.ob-tagline em{font-style:italic;color:var(--gold-light);}
.ob-body{font-size:0.88rem;color:var(--muted);line-height:1.7;max-width:290px;}
.ob-icon{font-size:3rem;margin-bottom:1rem;}
.ob-title{font-family:'Cormorant Garamond',serif;font-size:1.75rem;font-weight:600;color:var(--white);margin-bottom:0.6rem;}
.ob-desc{font-size:0.8rem;color:var(--muted);line-height:1.7;max-width:280px;}
.ob-dots{display:flex;gap:6px;margin-top:1.5rem;}
.ob-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.15);transition:all 0.3s;}
.ob-dot.act{background:var(--gold);width:18px;border-radius:3px;}
.ob-nav{position:absolute;bottom:0;left:0;right:0;padding:1.25rem 1.75rem calc(1.5rem + var(--safe-bottom));display:flex;flex-direction:column;gap:0.6rem;background:linear-gradient(to top,var(--navy) 80%,transparent);}
.btn-gold{background:var(--gold);color:var(--navy);border:none;padding:0.95rem;font-family:'DM Sans',sans-serif;font-size:0.9rem;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;width:100%;}
.btn-outline{background:transparent;color:var(--muted);border:1px solid rgba(255,255,255,0.1);padding:0.85rem;font-family:'DM Sans',sans-serif;font-size:0.78rem;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;width:100%;}
.btn-text{background:none;border:none;color:rgba(138,155,181,0.45);font-family:'DM Sans',sans-serif;font-size:0.7rem;cursor:pointer;padding:0.4rem;letter-spacing:0.08em;}
#auth{overflow-y:auto;}
.auth-wrap{padding:calc(var(--safe-top) + 1.25rem) 1.75rem calc(1.25rem + var(--safe-bottom));}
.auth-back{background:none;border:none;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:0.7rem;cursor:pointer;margin-bottom:1.25rem;letter-spacing:0.06em;}
.auth-logo{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:600;color:var(--white);margin-bottom:1rem;}
.auth-logo span{color:var(--gold);}
.auth-tabs{display:flex;border-bottom:1px solid rgba(255,255,255,0.07);margin-bottom:1.25rem;}
.auth-tab{flex:1;padding:0.55rem;font-size:0.68rem;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.2s;}
.auth-tab.act{color:var(--gold);border-bottom-color:var(--gold);}
.auth-hed{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:300;color:var(--white);margin-bottom:0.25rem;}
.auth-sub{font-size:0.72rem;color:var(--muted);margin-bottom:1.5rem;line-height:1.5;}
.fg{display:flex;flex-direction:column;gap:0.25rem;margin-bottom:0.8rem;}
.fg label{font-size:0.58rem;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);}
.fg input{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:var(--white);font-family:'DM Sans',sans-serif;font-size:0.82rem;padding:0.7rem;outline:none;transition:border-color 0.2s;width:100%;}
.fg input:focus{border-color:var(--gold);}
.fg input::placeholder{color:rgba(138,155,181,0.28);}
.auth-submit{width:100%;background:var(--gold);color:var(--navy);border:none;font-family:'DM Sans',sans-serif;font-size:0.75rem;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;padding:0.88rem;cursor:pointer;margin-top:0.4rem;transition:background 0.2s;}
.auth-submit:disabled{opacity:0.5;cursor:not-allowed;}
.auth-err{font-size:0.7rem;color:var(--red);padding:0.55rem 0.7rem;background:rgba(231,76,60,0.08);border:1px solid rgba(231,76,60,0.2);margin-bottom:0.7rem;display:none;}
.auth-ok{font-size:0.7rem;color:var(--green);padding:0.55rem 0.7rem;background:rgba(46,204,113,0.08);border:1px solid rgba(46,204,113,0.2);margin-bottom:0.7rem;display:none;}
.auth-link{font-size:0.7rem;color:var(--muted);text-align:center;margin-top:1rem;}
.auth-link a{color:var(--gold);cursor:pointer;}
.auth-forgot{font-size:0.62rem;color:var(--muted);text-align:right;cursor:pointer;margin-top:-0.4rem;margin-bottom:0.7rem;}
.plan-lbl{font-size:0.58rem;color:var(--muted);font-weight:500;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:0.5rem;margin-top:0.75rem;}
.plan-cards{display:flex;flex-direction:column;gap:0.5rem;margin-bottom:0.75rem;}
.plan-card{border:1px solid rgba(255,255,255,0.07);padding:0.75rem;cursor:pointer;transition:all 0.15s;position:relative;}
.plan-card.sel{border-color:var(--gold);background:var(--gold-dim);}
.pc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.15rem;}
.pc-name{font-size:0.76rem;font-weight:500;color:var(--white);}
.pc-price{font-family:'Cormorant Garamond',serif;font-size:1.05rem;font-weight:600;color:var(--gold);}
.pc-desc{font-size:0.62rem;color:var(--muted);}
.pc-check{position:absolute;top:0.55rem;right:0.55rem;width:15px;height:15px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:0.5rem;color:transparent;}
.plan-card.sel .pc-check{background:var(--gold);border-color:var(--gold);color:var(--navy);}
.plan-note{font-size:0.6rem;color:rgba(138,155,181,0.38);text-align:center;line-height:1.5;margin-bottom:0.75rem;}
#app{flex-direction:column;}
.topbar{background:var(--navy);border-bottom:1px solid rgba(201,168,76,0.12);padding:0.7rem 1.25rem;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;padding-top:calc(0.7rem + var(--safe-top));}
.tb-brand{display:flex;flex-direction:column;}
.tb-logo{font-family:'Cormorant Garamond',serif;font-size:1.25rem;font-weight:600;color:var(--white);letter-spacing:0.04em;line-height:1;}
.tb-logo span{color:var(--gold);}
.tb-sub{font-size:0.48rem;color:var(--muted);letter-spacing:0.15em;text-transform:uppercase;}
.tb-right{display:flex;align-items:center;gap:0.55rem;}
.tb-btn{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.05);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;}
.tb-dot{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--gold);border:1.5px solid var(--navy);}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--gold-dim);border:1.5px solid rgba(201,168,76,0.35);display:flex;align-items:center;justify-content:center;font-size:0.62rem;font-weight:500;color:var(--gold);cursor:pointer;}
.screens{flex:1;overflow:hidden;position:relative;}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;padding-bottom:80px;}
.screen::-webkit-scrollbar{display:none;}
.screen.active{display:block;}
.bottom-nav{background:rgba(10,22,40,0.97);border-top:1px solid rgba(201,168,76,0.12);display:flex;align-items:center;justify-content:space-around;padding:0.55rem 0;padding-bottom:calc(0.55rem + var(--safe-bottom));flex-shrink:0;}
.nb{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:3px 14px;min-width:56px;}
.nb .ni{font-size:1.05rem;color:var(--muted);transition:color 0.15s;}
.nb .nl{font-size:0.5rem;font-weight:500;letter-spacing:0.05em;text-transform:uppercase;color:var(--muted);transition:color 0.15s;}
.nb.active .ni,.nb.active .nl{color:var(--gold);}
.nb-voice{width:48px;height:48px;border-radius:50%;background:var(--gold);border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;margin-top:-16px;box-shadow:0 4px 18px rgba(201,168,76,0.38);}
.nb-voice .ni{font-size:0.95rem;color:var(--navy);margin:0;}
.nb-voice .nl{font-size:0.46rem;color:var(--navy);}
.home-hero{padding:1.25rem;background:linear-gradient(to bottom,#060e1a,var(--navy));}
.h-greet{font-size:0.58rem;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:0.2rem;}
.h-name{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:300;color:var(--white);margin-bottom:0.12rem;}
.h-name em{font-style:italic;color:var(--gold-light);}
.h-tag{font-size:0.68rem;color:var(--muted);line-height:1.5;}
.plan-pill{display:inline-flex;align-items:center;font-size:0.55rem;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;padding:2px 7px;margin-top:0.4rem;}
.plan-pill.free{background:rgba(138,155,181,0.08);color:var(--muted);border:1px solid rgba(138,155,181,0.18);}
.plan-pill.paid{background:var(--gold-dim);color:var(--gold);border:1px solid rgba(201,168,76,0.28);}
.free-cta{margin:1rem 1.25rem;background:var(--navy-mid);border:1px solid rgba(201,168,76,0.15);padding:1.1rem;}
.fc-label{font-size:0.58rem;color:var(--gold);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:0.4rem;}
.fc-title{font-family:'Cormorant Garamond',serif;font-size:1.15rem;color:var(--white);margin-bottom:0.4rem;line-height:1.3;}
.fc-body{font-size:0.7rem;color:var(--muted);margin-bottom:0.85rem;line-height:1.6;}
.fc-btn{background:var(--gold);color:var(--navy);border:none;font-family:'DM Sans',sans-serif;font-size:0.68rem;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;padding:0.65rem 1.25rem;cursor:pointer;}
.case-card{margin:1rem 1.25rem;background:var(--navy-mid);border:1px solid rgba(201,168,76,0.15);padding:1.1rem;position:relative;overflow:hidden;}
.case-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(to right,var(--gold),transparent);}
.cc-lbl{font-size:0.56rem;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);margin-bottom:0.5rem;display:flex;align-items:center;gap:0.35rem;}
.ldot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:blink 1.8s ease infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.2;}}
.cc-type{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:600;color:var(--white);margin-bottom:0.25rem;}
.cc-stage{font-size:0.68rem;color:var(--muted);margin-bottom:0.75rem;}
.cc-stage span{color:var(--gold);}
.mini-tl{display:flex;align-items:center;margin-bottom:0.75rem;}
.mtn{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.55rem;font-weight:500;flex-shrink:0;}
.mtn.done{background:var(--gold);color:var(--navy);}
.mtn.act{background:rgba(201,168,76,0.15);border:1.5px solid var(--gold);color:var(--gold);}
.mtn.pend{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:rgba(255,255,255,0.18);}
.mtc{flex:1;height:1.5px;background:rgba(255,255,255,0.06);}
.mtc.done{background:var(--gold);}
.prog-bar{background:rgba(255,255,255,0.06);height:3px;border-radius:2px;overflow:hidden;margin-bottom:0.35rem;}
.prog-fill{height:100%;background:var(--gold);border-radius:2px;}
.prog-lbl{font-size:0.58rem;color:var(--muted);}
.prog-lbl span{color:var(--gold);}
.cc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:0.75rem;padding-top:0.75rem;border-top:1px solid rgba(255,255,255,0.05);}
.cc-next{font-size:0.58rem;color:var(--muted);}
.cc-next strong{color:var(--white);}
.view-btn{font-size:0.58rem;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);background:none;border:1px solid rgba(201,168,76,0.3);padding:3px 9px;cursor:pointer;font-family:'DM Sans',sans-serif;}
.qa-wrap{padding:0 1.25rem;margin-bottom:0.85rem;}
.qa-lbl{font-size:0.55rem;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:0.5rem;}
.qa-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0.45rem;}
.qa{background:var(--navy-mid);border:1px solid rgba(255,255,255,0.05);padding:0.6rem 0.25rem;text-align:center;cursor:pointer;transition:all 0.15s;position:relative;}
.qa:hover{border-color:rgba(201,168,76,0.25);}
.qa-icon{font-size:1rem;margin-bottom:0.2rem;}
.qa-text{font-size:0.52rem;color:var(--muted);line-height:1.3;}
.qa-lock{position:absolute;top:3px;right:3px;font-size:0.5rem;color:var(--muted);opacity:0.45;}
.sec{padding:0 1.25rem;margin-bottom:0.85rem;}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.5rem;}
.sec-lbl{font-size:0.55rem;font-weight:500;letter-spacing:0.13em;text-transform:uppercase;color:var(--muted);}
.sec-link{color:var(--gold);font-size:0.58rem;text-decoration:none;cursor:pointer;background:none;border:none;font-family:'DM Sans',sans-serif;}
.doc-item{display:flex;align-items:center;gap:0.55rem;padding:0.5rem 0;border-bottom:1px solid rgba(255,255,255,0.04);}
.doc-item:last-child{border-bottom:none;}
.dicon{width:30px;height:30px;background:rgba(201,168,76,0.07);border:1px solid rgba(201,168,76,0.14);display:flex;align-items:center;justify-content:center;font-size:0.85rem;flex-shrink:0;}
.dinfo{flex:1;}
.dname{font-size:0.7rem;color:var(--white);margin-bottom:1px;}
.dmeta{font-size:0.56rem;color:var(--muted);}
.dstat{font-size:0.53rem;font-weight:500;padding:1px 5px;border-radius:2px;}
.dstat.filed{background:rgba(46,204,113,0.1);color:var(--green);}
.dstat.sent{background:var(--gold-dim);color:var(--gold);}
.dstat.review{background:rgba(52,152,219,0.1);color:#3498db;}
.ci{background:var(--navy-mid);border:1px solid rgba(255,255,255,0.05);padding:0.8rem;margin-bottom:0.45rem;cursor:pointer;display:flex;align-items:flex-start;gap:0.55rem;}
.ci:hover{border-color:rgba(201,168,76,0.18);}
.ci-num{font-family:'Cormorant Garamond',serif;font-size:1.25rem;font-weight:300;color:rgba(201,168,76,0.28);line-height:1;flex-shrink:0;min-width:24px;}
.ci-info{flex:1;}
.ci-badge{font-size:0.52rem;font-weight:500;letter-spacing:0.09em;text-transform:uppercase;padding:1px 5px;border-radius:2px;display:inline-block;margin-bottom:0.2rem;}
.ci-title{font-size:0.76rem;font-weight:500;color:var(--white);margin-bottom:0.12rem;}
.ci-lessons{font-size:0.58rem;color:var(--muted);}
.ci-arr{color:var(--muted);font-size:0.75rem;margin-top:2px;}
.voice-wrap{display:flex;flex-direction:column;align-items:center;padding:1.75rem 1.5rem 1rem;min-height:100%;}
.v-title{font-family:'Cormorant Garamond',serif;font-size:1.45rem;font-weight:300;color:var(--white);text-align:center;margin-bottom:0.35rem;}
.v-title em{font-style:italic;color:var(--gold-light);}
.v-sub{font-size:0.7rem;color:var(--muted);text-align:center;line-height:1.6;margin-bottom:1.5rem;max-width:260px;}
.mic-wrap{position:relative;margin-bottom:1.1rem;}
.mic-rings{position:absolute;inset:-26px;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.mic-ring{position:absolute;border-radius:50%;border:1px solid rgba(201,168,76,0.18);animation:rp 2s ease infinite;}
.mic-ring:nth-child(1){width:105px;height:105px;}
.mic-ring:nth-child(2){width:145px;height:145px;animation-delay:0.4s;}
.mic-ring:nth-child(3){width:185px;height:185px;animation-delay:0.8s;}
@keyframes rp{0%,100%{opacity:0.6;transform:scale(1);}50%{opacity:0;transform:scale(1.05);}}
.mic-ring.on{border-color:rgba(201,168,76,0.5);animation:rf 0.8s ease infinite;}
@keyframes rf{0%,100%{opacity:0.8;}50%{opacity:0.1;}}
.mic-btn{width:78px;height:78px;border-radius:50%;background:var(--gold);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;z-index:2;box-shadow:0 6px 22px rgba(201,168,76,0.32);transition:all 0.3s;}
.mic-btn.on{background:var(--red);box-shadow:0 6px 22px rgba(231,76,60,0.38);}
.mic-btn svg{width:26px;height:26px;}
.v-stat{font-size:0.68rem;color:var(--muted);text-align:center;margin-bottom:1.1rem;min-height:17px;}
.v-stat.active{color:var(--gold);}
.v-stat.thinking{color:#3498db;}
.transcript{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);padding:0.75rem;width:100%;max-width:320px;font-size:0.72rem;color:var(--white);line-height:1.6;font-style:italic;display:none;margin-bottom:0.75rem;}
.transcript.show{display:block;}
.ai-resp{width:100%;max-width:320px;display:none;}
.ai-resp.show{display:block;}
.ai-hdr{display:flex;align-items:center;gap:0.4rem;margin-bottom:0.5rem;}
.ai-icon{width:22px;height:22px;background:var(--gold-dim);border:1px solid rgba(201,168,76,0.28);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.6rem;}
.ai-lbl{font-size:0.55rem;color:var(--gold);letter-spacing:0.1em;text-transform:uppercase;}
.ai-body{font-size:0.72rem;color:var(--muted);line-height:1.8;background:var(--navy-mid);border:1px solid rgba(201,168,76,0.1);padding:0.8rem;margin-bottom:0.55rem;}
.ai-body strong{color:var(--white);}
/* Streaming cursor */
.ai-body .cursor{display:inline-block;width:2px;height:12px;background:var(--gold);animation:cur 0.8s ease infinite;vertical-align:middle;margin-left:2px;}
@keyframes cur{0%,100%{opacity:1;}50%{opacity:0;}}
.ai-btns{display:flex;gap:0.45rem;width:100%;max-width:320px;}
.ai-btn{flex:1;padding:0.55rem;font-family:'DM Sans',sans-serif;font-size:0.58rem;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;border:none;transition:all 0.2s;}
.ai-btn.play{background:var(--gold);color:var(--navy);}
.ai-btn.story{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:var(--muted);}
.ai-btn.rst{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);color:rgba(138,155,181,0.38);}
.chips-wrap{width:100%;max-width:320px;margin-top:1.1rem;}
.chips-lbl{font-size:0.55rem;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:0.45rem;}
.chips{display:flex;flex-wrap:wrap;gap:5px;}
.chip{font-size:0.6rem;padding:4px 8px;border:1px solid rgba(255,255,255,0.07);background:rgba(255,255,255,0.03);color:var(--muted);cursor:pointer;transition:all 0.15s;}
.chip:hover{border-color:rgba(201,168,76,0.28);color:var(--gold);}
.doc-sec{padding:1.25rem;}
.doc-sec h2{font-family:'Cormorant Garamond',serif;font-size:1.35rem;font-weight:300;color:var(--white);margin-bottom:0.2rem;}
.doc-sec p{font-size:0.68rem;color:var(--muted);margin-bottom:1.1rem;}
.upload-zone{border:1px dashed rgba(201,168,76,0.22);padding:1.1rem;text-align:center;margin-bottom:1.1rem;cursor:pointer;position:relative;transition:all 0.2s;}
.upload-zone:hover{background:rgba(201,168,76,0.03);border-color:rgba(201,168,76,0.45);}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.upload-icon{font-size:1.3rem;margin-bottom:0.25rem;color:rgba(201,168,76,0.38);}
.upload-txt{font-size:0.68rem;color:var(--muted);}
.upload-txt strong{color:var(--white);}
.dg-lbl{font-size:0.55rem;font-weight:500;letter-spacing:0.13em;text-transform:uppercase;color:var(--muted);margin-bottom:0.35rem;padding-bottom:0.28rem;border-bottom:1px solid rgba(255,255,255,0.05);}
.doc-list{margin-bottom:1.1rem;}
.acad-hero{padding:1.25rem;background:linear-gradient(to bottom,#060e1a,var(--navy));border-bottom:1px solid rgba(255,255,255,0.05);}
.acad-hero h2{font-family:'Cormorant Garamond',serif;font-size:1.45rem;font-weight:300;color:var(--white);margin-bottom:0.28rem;}
.acad-hero h2 em{font-style:italic;color:var(--gold-light);}
.acad-hero p{font-size:0.68rem;color:var(--muted);line-height:1.6;}
.course-list{padding:0.85rem 1.25rem;}
.prof-wrap{padding:1.25rem;}
.prof-av{width:60px;height:60px;border-radius:50%;background:var(--gold-dim);border:2px solid rgba(201,168,76,0.35);display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:500;color:var(--gold);margin:0 auto 0.55rem;}
.prof-name{font-family:'Cormorant Garamond',serif;font-size:1.25rem;font-weight:600;color:var(--white);text-align:center;margin-bottom:0.12rem;}
.prof-plan{font-size:0.56rem;color:var(--gold);letter-spacing:0.12em;text-transform:uppercase;text-align:center;margin-bottom:1.1rem;}
.prof-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0.45rem;margin-bottom:0.85rem;}
.ps{background:var(--navy-mid);border:1px solid rgba(255,255,255,0.05);padding:0.6rem;text-align:center;}
.ps-n{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:600;color:var(--gold);line-height:1;}
.ps-l{font-size:0.52rem;color:var(--muted);letter-spacing:0.07em;text-transform:uppercase;margin-top:2px;}
.pcard{background:var(--navy-mid);border:1px solid rgba(255,255,255,0.05);padding:0.85rem;margin-bottom:0.6rem;}
.pcard-title{font-size:0.56rem;font-weight:500;letter-spacing:0.13em;text-transform:uppercase;color:var(--muted);margin-bottom:0.55rem;}
.pf-row{display:flex;align-items:center;justify-content:space-between;padding:0.45rem 0;border-bottom:1px solid rgba(255,255,255,0.04);}
.pf-row:last-child{border-bottom:none;}
.pf-lbl{font-size:0.58rem;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;}
.pf-val{font-size:0.7rem;color:var(--white);text-align:right;}
.pf-val.gold{color:var(--gold);}
.toggle{width:32px;height:17px;background:var(--gold);border-radius:9px;position:relative;cursor:pointer;flex-shrink:0;}
.toggle.off{background:rgba(255,255,255,0.08);}
.toggle::after{content:'';position:absolute;width:13px;height:13px;border-radius:50%;background:var(--white);top:2px;right:2px;transition:transform 0.2s;}
.toggle.off::after{transform:translateX(-15px);}
.signout-btn{width:100%;background:transparent;border:1px solid rgba(231,76,60,0.18);color:rgba(231,76,60,0.55);font-family:'DM Sans',sans-serif;font-size:0.68rem;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;padding:0.65rem;cursor:pointer;margin-top:0.6rem;}
.story-player{position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;background:#060e1a;border-top:1px solid rgba(201,168,76,0.18);padding:0.8rem 1.25rem;padding-bottom:calc(0.8rem + var(--safe-bottom));display:none;z-index:100;}
.story-player.show{display:block;}
.sp-lbl{font-size:0.52rem;color:var(--gold);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:0.28rem;}
.sp-preface{font-size:0.66rem;color:var(--muted);line-height:1.5;margin-bottom:0.4rem;font-style:italic;display:none;}
.sp-preface.show{display:block;}
.sp-title{font-size:0.75rem;color:var(--white);margin-bottom:0.35rem;font-weight:500;}
.sp-prog{background:rgba(255,255,255,0.06);height:2.5px;border-radius:2px;overflow:hidden;margin-bottom:0.35rem;}
.sp-fill{height:100%;background:var(--gold);border-radius:2px;width:0%;transition:width 0.5s linear;}
.sp-ctrl{display:flex;align-items:center;gap:0.7rem;}
.sp-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.85rem;padding:2px;}
.sp-play{width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--navy);font-size:0.75rem;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;flex-shrink:0;}
.sp-time{font-family:monospace;font-size:0.58rem;color:var(--muted);margin-left:auto;}
.sp-x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.72rem;margin-left:0.2rem;}
.uw{position:fixed;inset:0;max-width:430px;margin:0 auto;background:rgba(6,14,26,0.96);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.75rem;}
.uw.show{display:flex;}
.uw-icon{font-size:2.2rem;margin-bottom:0.85rem;}
.uw-title{font-family:'Cormorant Garamond',serif;font-size:1.55rem;font-weight:600;color:var(--white);text-align:center;margin-bottom:0.4rem;}
.uw-body{font-size:0.75rem;color:var(--muted);text-align:center;line-height:1.7;margin-bottom:1.5rem;max-width:270px;}
.uw-plans{display:flex;flex-direction:column;gap:0.5rem;width:100%;max-width:310px;margin-bottom:1.1rem;}
.uw-plan{border:1px solid rgba(255,255,255,0.07);padding:0.85rem;cursor:pointer;}
.uw-plan.feat{border-color:var(--gold);background:var(--gold-dim);}
.uw-plan-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.18rem;}
.uw-pname{font-size:0.76rem;font-weight:500;color:var(--white);}
.uw-pprice{font-family:'Cormorant Garamond',serif;font-size:1.05rem;font-weight:600;color:var(--gold);}
