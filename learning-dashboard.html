<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academy Dashboard | Civitas</title>
  <!-- NETLIFY IDENTITY LOCK -->
  <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.location.href = "index.html";
        }
      });
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* (Keeping your original CSS styles) */
    :root { --navy: #0a1628; --navy-light: #12284c; --gold: #c9a84c; --gold-light: #e8c97a; --white: #ffffff; --off-white: #f8f6f1; --text-muted: #8a9bb5; --text-body: #2c3e5c; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--off-white); color: var(--text-body); display: flex; min-height: 100vh; }
    .sidebar { width: 260px; background: var(--navy); color: var(--white); display: flex; flex-direction: column; padding: 2rem 1.5rem; border-right: 1px solid rgba(201,168,76,0.2); }
    .logo { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; font-weight: 600; color: var(--white); text-decoration: none; margin-bottom: 3rem; text-align: center; }
    .logo span { color: var(--gold); }
    .nav-link { color: var(--text-muted); text-decoration: none; padding: 12px 15px; margin-bottom: 8px; border-radius: 6px; font-weight: 500; transition: all 0.3s ease; display: flex; align-items: center; gap: 10px; }
    .nav-link:hover { background: rgba(255,255,255,0.05); color: var(--white); }
    .nav-link.active { background: rgba(201,168,76,0.1); color: var(--gold); border-left: 3px solid var(--gold); }
    .main-content { flex: 1; padding: 3rem 4rem; overflow-y: auto; }
    .dashboard-header { margin-bottom: 3rem; display: flex; justify-content: space-between; align-items: flex-end; }
    .dashboard-header h1 { font-family: 'Cormorant Garamond', serif; font-size: 2.8rem; color: var(--navy); font-weight: 300; line-height: 1.1; margin-bottom: 0.5rem; }
    .dashboard-header p { color: var(--text-muted); }
    .course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem; }
    .course-card { background: var(--white); border-radius: 8px; overflow: hidden; box-shadow: 0 4px 20px rgba(10, 22, 40, 0.04); transition: transform 0.3s ease, box-shadow 0.3s ease; border: 1px solid rgba(10, 22, 40, 0.05); }
    .course-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(10, 22, 40, 0.08); }
    .course-thumbnail { height: 160px; background: var(--navy-light); position: relative; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.2); font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 600; }
    .course-content { padding: 1.5rem; }
    .course-tag { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gold); margin-bottom: 0.5rem; display: block; }
    .course-title { font-size: 1.2rem; font-weight: 600; color: var(--navy); margin-bottom: 1rem; line-height: 1.3; }
    .progress-wrapper { margin-bottom: 1.5rem; }
    .progress-bar { width: 100%; height: 6px; background: var(--off-white); border-radius: 3px; overflow: hidden; margin-bottom: 0.5rem; }
    .progress-fill { height: 100%; background: var(--gold); border-radius: 3px; }
    .progress-text { font-size: 0.85rem; color: var(--text-muted); display: flex; justify-content: space-between; }
    .resume-btn { display: inline-block; width: 100%; text-align: center; background: var(--white); color: var(--navy); text-decoration: none; padding: 10px 0; font-size: 0.9rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; border: 1px solid var(--gold); border-radius: 4px; transition: all 0.3s; }
    .resume-btn:hover { background: var(--gold); color: var(--white); }
  </style>
</head>
<body>
  <!-- (Body content remains same as your original) -->
</body>
</html>
