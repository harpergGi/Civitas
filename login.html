<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | Civitas Legal Document Services</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#0a1628;--navy-mid:#111f3a;--gold:#c9a84c;--gold-light:#e8c97a;--white:#fff;--muted:#8a9bb5;--red:#e74c3c;--green:#2ecc71;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--navy);font-family:'DM Sans',sans-serif;color:var(--white);min-height:100vh;display:flex;flex-direction:column;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(201,168,76,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(201,168,76,0.025) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;}
nav{padding:0 3rem;height:64px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(201,168,76,0.1);position:relative;z-index:2;}
.nav-logo{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:600;color:var(--white);text-decoration:none;letter-spacing:0.04em;}
.nav-logo span{color:var(--gold);}
.nav-back{font-size:0.7rem;color:var(--muted);text-decoration:none;letter-spacing:0.1em;text-transform:uppercase;transition:color 0.2s;}
.nav-back:hover{color:var(--gold);}
.page{flex:1;display:grid;grid-template-columns:1fr 480px;position:relative;z-index:1;}
.left{padding:4rem;display:flex;flex-direction:column;justify-content:center;}
.left-eye{display:flex;align-items:center;gap:0.75rem;margin-bottom:2rem;}
.left-line{width:36px;height:1px;background:var(--gold);}
.left-eye span{font-size:0.62rem;font-weight:500;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);}
.left h1{font-family:'Cormorant Garamond',serif;font-size:3.5rem;font-weight:300;line-height:1.1;margin-bottom:1.5rem;}
.left h1 em{font-style:italic;color:var(--gold-light);}
.left p{font-size:0.85rem;color:var(--muted);line-height:1.9;max-width:420px;margin-bottom:2rem;}
.feature-list{display:flex;flex-direction:column;gap:0.75rem;}
.feat{display:flex;align-items:flex-start;gap:0.75rem;}
.feat-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);flex-shrink:0;margin-top:6px;}
.feat-text{font-size:0.78rem;color:var(--muted);line-height:1.5;}
.feat-text strong{color:var(--white);}
.right{background:var(--navy-mid);border-left:1px solid rgba(201,168,76,0.1);display:flex;align-items:center;justify-content:center;padding:3rem 2.5rem;}
.form-box{width:100%;}
.form-title{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:600;color:var(--white);margin-bottom:0.4rem;}
.form-sub{font-size:0.72rem;color:var(--muted);margin-bottom:2rem;line-height:1.6;}
