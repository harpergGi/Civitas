<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password - Civitas</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0d238e; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: rgba(0,0,0,0.2); padding: 40px; border-radius: 8px; width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin-bottom: 20px; box-sizing: border-box; background: rgba(255,255,255,0.1); border: 1px solid #1a36c4; color: white; }
        button { width: 100%; padding: 12px; background-color: #f7d560; border: none; font-weight: bold; color: #333; cursor: pointer; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Enter New Password</h2>
        <input type="password" id="new-password" placeholder="Type new password here...">
        <button onclick="saveNewPassword()">Save Password</button>
    </div>

    <script>
        // REPLACE THESE TWO LINES WITH YOUR CODES FROM YOUR NOTEPAD
        const supabaseUrl = 'sb_publishable_HrE1YuE5pRRhDFhFeqlLWg_GUy9YKpS';
        const supabaseKey = 'sb_secret_eUPOlqcVQ_rBehy1uffApA_2i3v-wkZ';
        
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function saveNewPassword() {
            const newPassword = document.getElementById('new-password').value;
            
            const { data, error } = await supabase.auth.updateUser({
                password: newPassword
            });

            if (error) {
                alert("Error saving password: " + error.message);
            } else {
                alert("Password updated successfully! You will now be redirected to login.");
                window.location.href = "login.html"; 
            }
        }
    </script>
</body>
</html>
