<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professional Portal | Civitas</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0a1628; 
      --gold: #c9a84c; 
      --gold-light: #e8c97a; 
      --white: #ffffff; 
      --off-white: #f8f6f1;
      --text-muted: #8a9bb5; 
      --text-body: #2c3e5c;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--off-white); color: var(--text-body); }

    /* SIMPLE HEADER */
    header {
      background: var(--navy);
      padding: 1.5rem 4rem;
      border-bottom: 1px solid rgba(201,168,76,0.2);
    }
    .logo { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 600; color: var(--white); text-decoration: none; }
    .logo span { color: var(--gold); }

    /* MAIN CONTAINER */
    .portal-container {
      max-width: 800px;
      margin: 4rem auto;
      padding: 0 2rem;
    }
    
    .portal-header { text-align: center; margin-bottom: 3rem; }
    .portal-header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3.5rem;
      color: var(--navy);
      font-weight: 300;
      line-height: 1.1;
      margin-bottom: 1rem;
    }
    .portal-header p { color: var(--text-muted); font-size: 1.1rem; }

    /* FORM STYLING */
    .onboarding-form {
      background: var(--white);
      padding: 3rem;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(10, 22, 40, 0.05);
      border-top: 4px solid var(--gold);
    }

    .form-group { margin-bottom: 1.5rem; }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--navy);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .form-control {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      color: var(--text-body);
      transition: border-color 0.3s;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.1);
    }

    select.form-control { cursor: pointer; }

    .submit-btn {
      width: 100%;
      background: var(--gold);
      color: var(--navy);
      border: none;
      padding: 15px;
      font-size: 1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 1rem;
      transition: background 0.3s;
    }
    .submit-btn:hover { background: var(--gold-light); }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">Civitas<span>.</span></a>
  </header>

  <div class="portal-container">
    <div class="portal-header">
      <h1>Join the Professional Network</h1>
      <p>Submit your credentials to partner with Civitas Legal Document Services.</p>
    </div>

    <!-- ACTION ATTRIBUTE ADDED BELOW -->
    <form class="onboarding-form" name="lda-application" method="POST" action="success.html" data-netlify="true">
      
      <div class="form-group">
        <label for="fullName">Full Legal Name</label>
        <input type="text" id="fullName" name="fullName" class="form-control" placeholder="Jane Doe" required>
      </div>

      <div class="form-group">
        <label for="email">Professional Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="jane@example.com" required>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" class="form-control" placeholder="(555) 555-5555" required>
      </div>

      <div class="form-group">
        <label for="county">Primary California County</label>
        <input type="text" id="county" name="county" class="form-control" placeholder="e.g. Sacramento County" required>
      </div>

      <div class="form-group">
        <label for="licenseNum">LDA / Paralegal Registration Number</label>
        <input type="text" id="licenseNum" name="licenseNum" class="form-control" placeholder="e.g. LDA-123456" required>
      </div>

      <div class="form-group">
        <label for="specialty">Primary Area of Specialty</label>
        <select id="specialty" name="specialty" class="form-control" required>
          <option value="" disabled selected>Select an area of expertise...</option>
          <option value="tenant-rights">Tenant & Landlord Rights</option>
          <option value="consumer-debt">Consumer Debt & Collections</option>
          <option value="family-law">Family Law Document Prep</option>
          <option value="estate-planning">Estate Planning</option>
          <option value="other">Other</option>
        </select>
      </div>

      <button type="submit" class="submit-btn">Submit Application</button>
    </form>
  </div>

</body>
</html>
