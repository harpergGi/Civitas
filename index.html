<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Civitas Legal Document Services</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0a1628; --navy-mid: #142240; --navy-light: #1e3360;
    --gold: #c9a84c; --gold-light: #e8c97a; --white: #ffffff; --muted: #8a9bb5;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: var(--navy); overflow: hidden; }

  /* SPLASH WRAPPER */
  #splash {
    position: fixed; inset: 0; background: var(--navy);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 1000; transition: opacity 1.2s ease, transform 1.2s ease;
  }
  #splash.exit { opacity: 0; transform: scale(1.04); pointer-events: none; }

  .logo-area {
    position: relative;
    width: 500px;
    height: 400px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* SVG Ridges */
  .ridge {
    fill: none; stroke: var(--gold); stroke-width: 6; stroke-linecap: round;
    stroke-dasharray: 1000; stroke-dashoffset: 1000;
    transition: stroke-dashoffset 2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Dot Styling */
  .terminal-dot {
    fill: var(--white); r: 0;
    transition: r 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .center-dot { fill: var(--gold); r: 0; transition: r 0.8s ease; }

  /* Label Styling - Positioned relative to the Logo Area */
  .dot-label {
    position: absolute; font-family: 'DM Sans', sans-serif; font-size: 10px;
    font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase;
    opacity: 0; transition: opacity 0.8s ease, transform 0.8s ease;
    pointer-events: none;
    transform: translateY(5px);
  }
  .label-gold { color: var(--gold); }
  .label-white { color: var(--white); }

  /* Brand Typography */
  .wordmark {
    font-family: 'Cormorant Garamond', serif; font-size: 3.2rem; font-weight: 600;
    color: var(--white); letter-spacing: 0.25em; opacity: 0; margin-top: 1rem;
    transition: opacity 1.5s ease;
  }
  .tagline {
    font-family: 'DM Sans', sans-serif; font-size: 0.7rem; letter-spacing: 0.45em;
    text-transform: uppercase; color: var(--muted); opacity: 0;
    transition: opacity 1.5s ease; margin-top: 0.5rem;
  }

  .enter-btn {
    margin-top: 3rem; background: transparent; border: 1px solid rgba(201,168,76,0.3);
    color: var(--gold); padding: 0.8rem 2.5rem; font-size: 0.75rem; letter-spacing: 0.3em;
    text-transform: uppercase; cursor: pointer; opacity: 0; transition: all 0.4s ease;
    text-decoration: none;
  }
  .enter-btn:hover { background: var(--gold); color: var(--navy); border-color: var(--gold); }

</style>
</head>
<body>

<div id="splash">
  <div class="logo-area">
    <svg width="340" height="340" viewBox="0 0 300 300">
      <path id="r1" class="ridge" d="M 150,20 A 130,130 0 0,0 150,280" />
      <path id="r2" class="ridge" d="M 150,45 A 105,105 0 0,0 150,255" />
      <path id="r3" class="ridge" d="M 150,70 A 80,80 0 0,0 150,230" />
      <path id="r4" class="ridge" d="M 150,95 A 55,55 0 0,0 150,205" />
      <path id="r5" class="ridge" d="M 150,120 A 30,30 0 0,0 150,180" />

      <circle id="d1" class="terminal-dot" cx="150" cy="20" />
      <circle id="d2" class="terminal-dot" cx="70" cy="75" />
      <circle id="d3" class="terminal-dot" cx="40" cy="150" />
      <circle id="d4" class="terminal-dot" cx="70" cy="225" />
      <circle id="d5" class="terminal-dot" cx="150" cy="280" />
      <circle id="cdot" class="center-dot" cx="150" cy="150" />
    </svg>

    <div id="l1" class="dot-label label-white" style="top: -20px;">You belong here.</div>
    <div id="l2" class="dot-label label-gold" style="top: 55px; left: -20px;">Credit Disputes</div>
    <div id="l3" class="dot-label label-white" style="top: 145px; left: -160px; width: 180px; text-align: right;">Their policy is not the law.</div>
    <div id="l4" class="dot-label label-gold" style="bottom: 55px; left: -20px;">Goodwill Letters</div>
    <div id="l5" class="dot-label label-white" style="bottom: -20px;">The system has a process. So do we.</div>
    
    <div id="l6" class="dot-label label-gold" style="top: 100px; right: -120px;">Debt Validation</div>
    <div id="l7" class="dot-label label-white" style="bottom: 100px; right: -140px; width: 180px; text-align: left;">Press your mark. Own your ground.</div>
  </div>

  <div class="wordmark" id="wm">CIVITAS</div>
  <div class="tagline" id="tg">Legal Document Services</div>
  
  <div id="ebtn" class="enter-btn" onclick="enterSite()">Enter Site &rarr;</div>
</div>

<script>
  function runSplash() {
    const get = (id) => document.getElementById(id);
    
    // 1. Sequence the ridges
    setTimeout(() => get('r1').style.strokeDashoffset = "590", 400);
    setTimeout(() => get('r2').style.strokeDashoffset = "670", 700);
    setTimeout(() => get('r3').style.strokeDashoffset = "745", 1000);
    setTimeout(() => get('r4').style.strokeDashoffset = "825", 1300);
    setTimeout(() => get('r5').style.strokeDashoffset = "905", 1600);

    // 2. Pop the center dot
    setTimeout(() => get('cdot').setAttribute('r', '7'), 2200);

    // 3. Pop terminal dots and fade labels in sync
    const order = [1, 2, 3, 4, 5];
    order.forEach((num, i) => {
      setTimeout(() => {
        get('d' + num).setAttribute('r', '5');
        get('l' + num).style.opacity = "1";
        get('l' + num).style.transform = "translateY(0)";
      }, 2600 + (i * 450));
    });

    // 4. Final Balance labels
    setTimeout(() => {
        get('l6').style.opacity = "1"; get('l6').style.transform = "translateY(0)";
        get('l7').style.opacity = "1"; get('l7').style.transform = "translateY(0)";
    }, 4800);

    // 5. Final Brand revealing
    setTimeout(() => get('wm').style.opacity = "1", 5800);
    setTimeout(() => get('tg').style.opacity = "1", 6200);
    setTimeout(() => get('ebtn').style.opacity = "1", 7200);

    // 6. Auto-advance after 12s
    setTimeout(() => enterSite(), 12000);
  }

  function enterSite() {
    document.getElementById('splash').classList.add('exit');
    setTimeout(() => {
      window.location.href = "main.html"; // Jumps to your polished main page
    }, 1200);
  }

  window.onload = runSplash;
</script>
</body>
</html>
