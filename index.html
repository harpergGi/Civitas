<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Civitas Legal Document Services | California LDA</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0a1628; --gold: #c9a84c; --gold-light: #e8c97a;
    --white: #ffffff; --muted: #8a9bb5; --text: #2c3e5c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: var(--navy); color: white; overflow-x: hidden; }

  /* SPLASH SCREEN */
  #splash {
    position: fixed; inset: 0; background: var(--navy);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 1000; transition: opacity 1.2s ease, transform 1.2s ease;
  }
  #splash.exit { opacity: 0; transform: scale(1.04); pointer-events: none; }

  .logo-area { position: relative; width: 450px; height: 350px; display: flex; justify-content: center; align-items: center; }
  
  /* Fingerprint Ridges */
  .ridge {
    fill: none; stroke: var(--gold); stroke-width: 6; stroke-linecap: round;
    stroke-dasharray: 1000; stroke-dashoffset: 1000;
    transition: stroke-dashoffset 2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .dot { fill: var(--white); r: 0; transition: r 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  .gold-dot { fill: var(--gold); r: 0; transition: r 0.8s ease; }

  /* Statement Labels - UNALIGNED and PUSHED INWARD */
  .dot-label {
    position: absolute; font-family: 'DM Sans', sans-serif; font-size: 10px;
    font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase;
    opacity: 0; transition: opacity 0.8s ease; pointer-events: none;
    text-shadow: 0 0 10px rgba(10,22,40,0.8);
  }
  .l-gold { color: var(--gold); }

  .wordmark { font-family: 'Cormorant Garamond', serif; font-size: 3.5rem; letter-spacing: 0.2em; opacity: 0; transition: opacity 1.5s ease; margin-top: 1rem; }
  .tagline { font-family: 'DM Sans', sans-serif; font-size: 0.7rem; letter-spacing: 0.4em; color: var(--muted); opacity: 0; transition: opacity 1.5s ease; }

  .enter-btn {
    margin-top: 3.5rem; background: transparent; border: 1px solid rgba(201,168,76,0.3);
    color: var(--gold); padding: 0.9rem 2.8rem; font-size: 0.75rem; letter-spacing: 0.35em;
    text-transform: uppercase; cursor: pointer; opacity: 0; transition: all 0.4s ease;
  }
  .enter-btn:hover { background: var(--gold); color: var(--navy); }

  /* MAIN SITE */
  #site { position: fixed; inset: 0; opacity: 0; overflow-y: auto; transition: opacity 1s ease 0.3s; pointer-events: none; }
  #site.visible { opacity: 1; pointer-events: all; position: relative; }

  /* TICKER */
  .ticker-bar{background:#060e1a;border-bottom:1px solid rgba(201,168,76,0.2);height:38px;display:flex;align-items:center;overflow:hidden;}
  .ticker-label{background:var(--gold);color:var(--navy);font-size:0.58rem;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;padding:0 1rem;height:100%;display:flex;align-items:center;white-space:nowrap;flex-shrink:0;}
  .ticker-track{display:flex;animation:ticker 60s linear infinite;white-space:nowrap;}
  @keyframes ticker{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}
  .ti{font-size:0.68rem;color:var(--white);padding:0 2rem;display:flex;align-items:center;gap:0.5rem;border-right:1px solid rgba(255,255,255,0.05);}
  .ti .d{width:4px;height:4px;border-radius:50%;background:var(--gold);}

  nav { position: sticky; top: 0; background: var(--navy); height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 4rem; border-bottom: 1px solid rgba(201,168,76,0.2); z-index: 100; }
  .nav-links { display: flex; gap: 2.5rem; list-style: none; }
  .nav-links a { font-size: 0.75rem; color: var(--muted); text-decoration: none; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 500; }
  .nav-links a:hover { color: var(--gold); }
  
  .hero { min-height: calc(100vh - 110px); background: var(--navy); display: grid; grid-template-columns: 1.1fr 1fr; padding: 0 4rem; align-items: center; gap: 0; }
  h1 { font-family: 'Cormorant Garamond', serif; font-size: 5rem; font-weight: 300; line-height: 1.05; margin-bottom: 2rem; color: white; }
  h1 em { font-style: italic; color: var(--gold); }
  .hero-sub { color: var(--muted); line-height: 1.8; max-width: 500px; margin-bottom: 3rem; font-size: 1.1rem; }

  /* FADE ANIMATION FOR LOGO ON MAIN SITE */
  .hero-logo-fade { opacity: 0; animation: fadeInLogo 1.5s ease forwards 0.8s; }
  @keyframes fadeInLogo { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

  /* GENERAL SECTIONS */
  section { padding: 8rem 4rem; background: var(--off-white); color: var(--text); scroll-margin-top: 72px; }
  .section-title { font-family: 'Cormorant Garamond', serif; font-size: 3.5rem; color: var(--navy); margin-bottom: 2rem; }
  
  /* FOOTER */
  footer { padding: 3rem 4rem; background: var(--navy); display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(201,168,76,0.1); }
</style>
</head>
