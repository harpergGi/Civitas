<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Civitas Legal Document Services</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a1628;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
  }

  .splash-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    opacity: 0;
    animation: fadeIn 0.6s ease 0.3s forwards;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  #civitas-logo {
    width: 320px;
    height: 320px;
  }

  .wordmark {
    text-align: center;
    opacity: 0;
  }

  .wordmark-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 3.2rem;
    font-weight: 300;
    color: #ffffff;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    display: block;
    margin-bottom: 0.4rem;
  }

  .wordmark-name span { color: #c9a84c; }

  .wordmark-sub {
    font-size: 0.62rem;
    font-weight: 500;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #8a9bb5;
    display: block;
  }

  .enter-btn {
    opacity: 0;
    background: transparent;
    border: 1px solid #c9a84c;
    color: #c9a84c;
    padding: 0.75rem 2.5rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s;
    display: inline-block;
    margin-top: 0.5rem;
  }

  .enter-btn:hover {
    background: #c9a84c;
    color: #0a1628;
  }

  .skip-btn {
    position: fixed;
    bottom: 2rem;
    right: 2.5rem;
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #4a5a72;
    cursor: pointer;
    background: none;
    border: none;
    font-family: 'DM Sans', sans-serif;
    transition: color 0.2s;
  }

  .skip-btn:hover { color: #c9a84c; }

  .fade-out {
    animation: fadeOut 0.8s ease forwards !important;
  }

  @keyframes fadeOut {
    to { opacity: 0; pointer-events: none; }
  }
</style>
</head>
<body>

<div class="splash-container" id="splash">

  <svg id="civitas-logo" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="thumbClip">
        <ellipse cx="160" cy="155" rx="95" ry="110"/>
      </clipPath>
      <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.15"/>
        <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- Glow background -->
    <ellipse cx="160" cy="155" rx="110" ry="125" fill="url(#glowGrad)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.5s" fill="freeze"/>
    </ellipse>

    <!-- Thumbprint outline -->
    <ellipse cx="160" cy="155" rx="95" ry="110"
      fill="none" stroke="#c9a84c" stroke-width="1.5" opacity="0"
      stroke-dasharray="650" stroke-dashoffset="650">
      <animate attributeName="stroke-dashoffset" from="650" to="0" dur="1.8s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.3s" fill="freeze"/>
    </ellipse>

    <!-- Fingerprint ridges clipped inside thumbprint - organic flowing lines -->
    <g clip-path="url(#thumbClip)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.2s" fill="freeze"/>

      <!-- Ridge 1 - outermost -->
      <path d="M 90 100 Q 120 75 160 72 Q 200 75 225 100 Q 240 125 238 155 Q 235 185 215 205 Q 195 222 160 225 Q 125 222 105 205 Q 85 185 82 155 Q 80 125 90 100"
        fill="none" stroke="#c9a84c" stroke-width="1" stroke-opacity="0.5"
        stroke-dasharray="600" stroke-dashoffset="600">
        <animate attributeName="stroke-dashoffset" from="600" to="0" dur="1.2s" begin="1.3s" fill="freeze"/>
      </path>

      <!-- Ridge 2 -->
      <path d="M 100 108 Q 128 85 160 82 Q 192 85 212 108 Q 228 130 226 158 Q 223 185 205 203 Q 187 218 160 220 Q 133 218 115 203 Q 97 185 95 158 Q 93 130 100 108"
        fill="none" stroke="#c9a84c" stroke-width="1" stroke-opacity="0.55"
        stroke-dasharray="560" stroke-dashoffset="560">
        <animate attributeName="stroke-dashoffset" from="560" to="0" dur="1.2s" begin="1.5s" fill="freeze"/>
      </path>

      <!-- Ridge 3 -->
      <path d="M 112 118 Q 136 97 160 94 Q 184 97 202 118 Q 215 136 214 160 Q 212 182 196 198 Q 180 212 160 214 Q 140 212 124 198 Q 108 182 106 160 Q 105 136 112 118"
        fill="none" stroke="#c9a84c" stroke-width="1" stroke-opacity="0.6"
        stroke-dasharray="510" stroke-dashoffset="510">
        <animate attributeName="stroke-dashoffset" from="510" to="0" dur="1.1s" begin="1.7s" fill="freeze"/>
      </path>

      <!-- Ridge 4 - fork detail left -->
      <path d="M 122 128 Q 138 110 160 107 Q 178 108 192 122"
        fill="none" stroke="#c9a84c" stroke-width="1" stroke-opacity="0.5"
        stroke-dasharray="120" stroke-dashoffset="120">
        <animate attributeName="stroke-dashoffset" from="120" to="0" dur="0.6s" begin="1.9s" fill="freeze"/>
      </path>
      <path d="M 192 122 Q 202 138 200 160 Q 198 180 184 194 Q 170 206 160 207 Q 150 206 140 194 Q 126 180 124 160 Q 123 142 130 130"
        fill="none" stroke="#c9a84c" stroke-width="1" stroke-opacity="0.6"
        stroke-dasharray="220" stroke-dashoffset="220">
        <animate attributeName="stroke-dashoffset" from="220" to="0" dur="0.8s" begin="2.0s" fill="freeze"/>
      </path>

      <!-- Ridge 5 - inner whorl start -->
      <path d="M 136 138 Q 147 128 160 126 Q 173 128 182 138 Q 190 150 188 163 Q 186 176 176 184 Q 168 190 160 191 Q 152 190 144 184 Q 134 176 132 163 Q 131 150 136 138"
        fill="none" stroke="#c9a84c" stroke-width="1" stroke-opacity="0.65"
        stroke-dasharray="240" stroke-dashoffset="240">
        <animate attributeName="stroke-dashoffset" from="240" to="0" dur="0.9s" begin="2.2s" fill="freeze"/>
      </path>

      <!-- Ridge 6 - tight inner -->
      <path d="M 146 148 Q 153 141 160 140 Q 167 141 173 148 Q 178 156 177 164 Q 175 172 169 177 Q 165 180 160 180 Q 155 180 151 177 Q 145 172 143 164 Q 142 156 146 148"
        fill="none" stroke="#c9a84c" stroke-width="1" stroke-opacity="0.7"
        stroke-dasharray="180" stroke-dashoffset="180">
        <animate attributeName="stroke-dashoffset" from="180" to="0" dur="0.7s" begin="2.4s" fill="freeze"/>
      </path>

      <!-- Ridge 7 - core -->
      <path d="M 154 156 Q 157 152 160 151 Q 163 152 166 156 Q 168 160 167 164 Q 166 168 163 170 Q 162 171 160 171 Q 158 171 157 170 Q 154 168 153 164 Q 152 160 154 156"
        fill="none" stroke="#c9a84c" stroke-width="1.2" stroke-opacity="0.8"
        stroke-dasharray="80" stroke-dashoffset="80">
        <animate attributeName="stroke-dashoffset" from="80" to="0" dur="0.5s" begin="2.6s" fill="freeze"/>
      </path>
    </g>

    <!-- Center gold dot -->
    <circle cx="160" cy="161" r="4" fill="#c9a84c" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.9s" fill="freeze"/>
      <animate attributeName="r" from="0" to="4" dur="0.4s" begin="2.9s" fill="freeze"/>
    </circle>

    <!-- Dots on ridges with labels -->
    <!-- Top dot: "You belong here." -->
    <circle cx="160" cy="74" r="3.5" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.1s" fill="freeze"/>
    </circle>
    <text x="160" y="52" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="8.5" fill="#ffffff" letter-spacing="0.08em" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.1s" fill="freeze"/>
      YOU BELONG HERE.
    </text>

    <!-- Upper-right dot: "Credit Disputes" -->
    <circle cx="228" cy="108" r="3.5" fill="none" stroke="#c9a84c" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.4s" fill="freeze"/>
    </circle>
    <text font-family="DM Sans, sans-serif" font-size="8" fill="#c9a84c" letter-spacing="0.06em" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.4s" fill="freeze"/>
      <tspan x="238" y="112">CREDIT DISPUTES</tspan>
    </text>

    <!-- Right dot: "Their policy is not law." -->
    <circle cx="238" cy="155" r="3.5" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.7s" fill="freeze"/>
    </circle>
    <text font-family="DM Sans, sans-serif" font-size="7.5" fill="#ffffff" letter-spacing="0.05em" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.7s" fill="freeze"/>
      <tspan x="247" y="153">THEIR POLICY</tspan>
      <tspan x="247" dy="10">IS NOT LAW.</tspan>
    </text>

    <!-- Lower-right dot: "Goodwill Letters" -->
    <circle cx="218" cy="200" r="3.5" fill="none" stroke="#c9a84c" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="4.0s" fill="freeze"/>
    </circle>
    <text font-family="DM Sans, sans-serif" font-size="8" fill="#c9a84c" letter-spacing="0.06em" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="4.0s" fill="freeze"/>
      <tspan x="227" y="204">GOODWILL LETTERS</tspan>
    </text>

    <!-- Bottom dot: "The system has a process. So do we." -->
    <circle cx="160" cy="226" r="3.5" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="4.3s" fill="freeze"/>
    </circle>
    <text text-anchor="middle" font-family="DM Sans, sans-serif" font-size="7.5" fill="#ffffff" letter-spacing="0.05em" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="4.3s" fill="freeze"/>
      <tspan x="160" y="244">THE SYSTEM HAS A PROCESS.</tspan>
      <tspan x="160" dy="10">SO DO WE.</tspan>
    </text>

    <!-- Lower-left dot: "Debt Validation" -->
    <circle cx="102" cy="200" r="3.5" fill="none" stroke="#c9a84c" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="4.6s" fill="freeze"/>
    </circle>
    <text text-anchor="end" font-family="DM Sans, sans-serif" font-size="8" fill="#c9a84c" letter-spacing="0.06em" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="4.6s" fill="freeze"/>
      <tspan x="93" y="204">DEBT VALIDATION</tspan>
    </text>

    <!-- Left dot: "Legal Document Prep" -->
    <circle cx="82" cy="155" r="3.5" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="4.9s" fill="freeze"/>
    </circle>
    <text text-anchor="end" font-family="DM Sans, sans-serif" font-size="7.5" fill="#ffffff" letter-spacing="0.05em" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="4.9s" fill="freeze"/>
      <tspan x="73" y="153">LEGAL DOCUMENT</tspan>
      <tspan x="73" dy="10">PREPARATION</tspan>
    </text>
  </svg>

  <div class="wordmark" id="wordmark" style="animation: fadeIn 0.8s ease 5.3s forwards;">
    <span class="wordmark-name">Civitas<span>.</span></span>
    <span class="wordmark-sub">Legal Document Services</span>
  </div>

  <a href="main.html" class="enter-btn" id="enterBtn" style="animation: fadeIn 0.6s ease 5.8s forwards;">
    Enter Site
  </a>

</div>

<button class="skip-btn" onclick="goToSite()">Skip Intro</button>

<script>
  function goToSite() {
    document.getElementById('splash').classList.add('fade-out');
    setTimeout(() => { window.location.href = 'main.html'; }, 800);
  }

  // Auto-transition after 13 seconds
  setTimeout(goToSite, 13000);

  document.getElementById('enterBtn').addEventListener('click', function(e) {
    e.preventDefault();
    goToSite();
  });
</script>

</body>
</html>
